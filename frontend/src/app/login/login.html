<div class="login-container">

  <div class="login-card">

    <h1>MediConnect</h1>

    <p class="subtitle">
      Sistema de Gestión de Citas Médicas
    </p>

    <form (ngSubmit)="iniciarSesion()">

      <div class="form-group">
        <label for="email">Correo electrónico</label>

        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="admin@mediconnect.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>

        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Ingresa tu contraseña"
          required
        />
      </div>

      <button type="submit">
        Iniciar sesión
      </button>

      @if (error) {
        <p class="error">
          {{ error }}
        </p>
      }

    </form>

  </div>

</div>
